<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le QG</title>
<meta name="theme-color" content="#0f0f12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&family=Bangers&family=Anton&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3eef8; --surface:#ffffff; --surface2:#ebe4f3; --ink:#1d1830; --muted:#6c6488;
  --line:#d9d0e6; --rec:#e0283f; --tape:#c98f00; --cool:#3b6cf6; --ok:#1f9d6b;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f0f12; --surface:#1b1b20; --surface2:#2a2a31; --ink:#f3f3f5; --muted:#9a9aa6;
    --line:#33333b; --rec:#34d8ae; --tape:#ffc83d; --cool:#7b9cff; --ok:#34d8ae;
  }
}
:root[data-theme="dark"]{
  --bg:#0f0f12; --surface:#1b1b20; --surface2:#2a2a31; --ink:#f3f3f5; --muted:#9a9aa6;
    --line:#33333b; --rec:#34d8ae; --tape:#ffc83d; --cool:#7b9cff; --ok:#34d8ae;
}
:root[data-theme="dark"] .btn.rec{color:#05231b}
:root[data-theme="dark"] .tab[aria-current="true"]{background:var(--rec);color:#05231b}
:root[data-theme="dark"] .day[aria-pressed="true"]{background:var(--rec);border-color:var(--rec);color:#05231b}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;margin:0;line-height:1.1}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--cool)}
:focus-visible{outline:2px solid var(--cool);outline-offset:2px}
img{max-width:100%}
.hidden{display:none!important}
.spacer{flex:1}

/* ---------- top ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1150px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 14px}
.logo{display:flex;align-items:center;gap:9px}
.recdot{width:12px;height:12px;border-radius:50%;background:#ff4d61;box-shadow:0 0 0 4px rgba(255,77,97,.22)}
@media (prefers-reduced-motion:no-preference){.recdot{animation:blink 2s steps(1) infinite}}
@keyframes blink{50%{opacity:.25}}
.logo h1{font-size:1.45rem;font-weight:800;letter-spacing:-.02em}
.save{font-size:.78rem;color:var(--muted);white-space:nowrap}
.save.warn{color:var(--rec);font-weight:700}
.people{display:flex}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:700;color:#fff;border:2px solid var(--bg);margin-left:-7px;flex:none}
.av.sm{width:22px;height:22px;font-size:.65rem;margin:0;border:0}
.iconbtn{position:relative;border:1px solid var(--line);background:var(--surface);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.badge{position:absolute;top:-6px;right:-6px;background:#ff4d61;color:#fff;font-size:.68rem;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.tabs-top{display:none;gap:4px;margin-left:10px}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:999px;font-weight:700;color:var(--muted)}
.tab[aria-current="true"]{background:var(--ink);color:var(--bg)}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);display:grid;grid-template-columns:repeat(5,1fr)}
.bottom .tab{border-radius:0;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.74rem}
.bottom .tab span{font-size:1.25rem;line-height:1.1}
.bottom .tab[aria-current="true"]{background:transparent;color:var(--ink)}
@media (min-width:820px){.bottom{display:none}.tabs-top{display:flex}}
@media (max-width:420px){.save{display:none}}

/* ---------- banners ---------- */
.banners{max-width:1150px;margin:0 auto;padding:0 14px}
.bn{margin-top:10px;padding:10px 14px;border-radius:12px;font-size:.9rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid}
.bn.red{background:color-mix(in srgb,var(--rec) 14%,var(--surface));border-color:var(--rec)}
.bn.orange{background:color-mix(in srgb,var(--tape) 18%,var(--surface));border-color:var(--tape)}
.bn.green{background:color-mix(in srgb,var(--ok) 15%,var(--surface));border-color:var(--ok)}
.bn.blue{background:color-mix(in srgb,var(--cool) 14%,var(--surface));border-color:var(--cool)}
.bn b{font-weight:700}

main{max-width:1150px;margin:0 auto;padding:16px 14px 110px}
main.wide{max-width:1700px}
@media (min-width:820px){main{padding-bottom:40px}}

/* ---------- generic ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;background:var(--ink);color:var(--bg)}
.btn.rec{background:var(--rec);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.small{padding:6px 12px;font-size:.88rem;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.field{width:100%;background:var(--surface2);border:1px solid transparent;border-radius:12px;padding:10px 12px;outline:none;min-width:0}
.field:focus{border-color:var(--cool);background:var(--surface)}
select.field{appearance:auto}
textarea.field{resize:vertical;min-height:200px;line-height:1.6}
.muted{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:24px 12px;font-size:.95rem}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 10px}
.sec h2{font-size:1.25rem}
.sec.first{margin-top:0}
.big{font-size:clamp(1.6rem,5vw,2.3rem)!important;font-weight:800;letter-spacing:-.02em}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.88rem;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:90;font-size:.92rem;max-width:90vw;text-align:center}
.st{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface2);white-space:nowrap}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.tag{font-size:.75rem;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.x{border:0;background:transparent;color:var(--muted);font-size:1.1rem;padding:2px 6px;border-radius:8px;flex:none}
.x:hover{color:var(--rec)}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login .panel{width:100%;max-width:400px}
.login h1{font-size:2.6rem;font-weight:800;letter-spacing:-.03em;display:flex;align-items:center;gap:12px;margin-bottom:6px}
.login label{display:block;font-size:.85rem;font-weight:700;color:var(--muted);margin:12px 0 5px}

/* ---------- planning ---------- */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:14px 0 4px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 2px 9px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1px}
.day small{font-size:.7rem;color:var(--muted)}
.day b{font-family:"Bricolage Grotesque",sans-serif;font-size:1.3rem}
.day .dots{display:flex;gap:3px;height:6px}
.day .dots i{width:6px;height:6px;border-radius:50%;background:var(--muted)}
.day .dots i.v{background:var(--rec)}
.day.today b{color:var(--rec)}
.day[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.day[aria-pressed="true"] small{color:inherit;opacity:.7}
.day[aria-pressed="true"].today b{color:var(--bg)}
.plan-grid{display:grid;gap:16px}
@media (min-width:820px){.plan-grid{grid-template-columns:1.15fr 1fr}}
.task{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task input[type=checkbox]{width:20px;height:20px;accent-color:var(--ok);flex:none}
.task .t{flex:1;word-break:break-word;min-width:0}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.dayhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dayhead h2::first-letter{text-transform:uppercase}

/* ---------- videos ---------- */
.board{display:grid;gap:14px}
@media (min-width:820px){.board{grid-template-columns:repeat(5,minmax(200px,1fr));overflow-x:auto;padding-bottom:6px}}
.col h3{font-size:1rem;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.vcard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;padding:0;margin-bottom:8px;overflow:hidden}
.vcard .cv{aspect-ratio:16/9;background:var(--surface2) center/cover no-repeat}
.vcard .in{padding:11px 12px}
.vcard h4{margin:0 0 6px;font-size:1rem;line-height:1.3;word-break:break-word}
.vmeta{display:flex;gap:6px 10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);align-items:center}
.bar{height:4px;background:var(--surface2);border-radius:4px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}

/* ---------- ideas ---------- */
.gen{position:relative;overflow:hidden}
.gen::after{content:"";position:absolute;right:-50px;bottom:-50px;width:170px;height:170px;border-radius:50%;background:var(--tape);opacity:.16;pointer-events:none}
.gen h2{max-width:16ch}
.results{display:grid;gap:8px;margin-top:14px;position:relative;z-index:1}
.res{background:var(--surface2);border-radius:12px;padding:12px 14px}
.res .tt{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:1.08rem;line-height:1.3}
.res p{margin:4px 0 8px;font-size:.92rem;color:var(--muted)}
.idea{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.idea:last-child{border-bottom:0}
.idea .body{flex:1;min-width:0}
.idea .tt{font-weight:700;word-break:break-word}
.star{border:0;background:transparent;font-size:1.1rem;padding:2px 4px;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.star small{font-size:.7rem;color:var(--muted)}

/* ---------- files ---------- */
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.file{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.file .thumb{aspect-ratio:16/10;background:var(--surface2);display:grid;place-items:center;font-size:2rem;overflow:hidden;text-decoration:none}
.file .thumb img,.file .thumb video{width:100%;height:100%;object-fit:cover}
.file .fi{padding:8px 10px;font-size:.8rem;display:flex;flex-direction:column;gap:2px;min-width:0}
.file .fi a{color:var(--ink);font-weight:700;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .fi span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drop{border:2px dashed var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--muted)}

/* ---------- sheets ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:50;background:rgba(10,8,18,.5);display:flex;justify-content:flex-end}
.sheet{background:var(--bg);width:100%;max-width:660px;height:100%;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px calc(env(safe-area-inset-bottom,0px) + 40px)}
.titlein{font-family:"Bricolage Grotesque",sans-serif;font-size:1.6rem;font-weight:800;background:transparent;border:0;border-bottom:2px solid var(--line);border-radius:0;padding:6px 0;width:100%;outline:none}
.titlein:focus{border-color:var(--rec)}
.sheet label.l{display:block;font-size:.85rem;font-weight:700;color:var(--muted);margin:16px 0 6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.edited{font-size:.8rem;color:var(--muted);margin-top:6px}
.link{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.link a{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmt{display:flex;gap:8px;padding:8px 0}
.cmt .bub{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;flex:1;min-width:0;word-break:break-word}
.cmt.me .bub{background:color-mix(in srgb,var(--cool) 12%,var(--surface))}
.cmt small{color:var(--muted);font-size:.74rem}
.act{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.act.new{font-weight:700}
.lb{position:fixed;inset:0;z-index:92;background:rgba(6,5,12,.94);display:flex;flex-direction:column;color:#f1ecf7;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.lb-top{display:flex;align-items:center;gap:10px;padding:10px 14px}
.lb-top .nm{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-top small{display:block;font-weight:400;opacity:.7}
.lb-b{display:inline-flex!important;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;border-radius:10px;min-width:40px;height:40px;padding:0 10px;font-size:1rem;text-decoration:none;display:grid;place-items:center;flex:none}
.lb-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;padding:0 8px 12px}
.lb-stage img,.lb-stage video{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;user-select:none}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;font-size:1.6rem}
.lb-nav.p{left:10px}.lb-nav.n{right:10px}
.lb-count{text-align:center;font-size:.85rem;opacity:.7;padding-bottom:10px}
.cover-big{display:block;width:100%;border:0;padding:0;background:var(--surface2);border-radius:14px;overflow:hidden;margin-top:12px;position:relative}
.cover-big img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.cover-big span{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.6);color:#fff;font-size:.8rem;padding:4px 10px;border-radius:999px}
.file .thumb{cursor:zoom-in;border:0;padding:0;width:100%;color:inherit}
.dlg-wrap{position:fixed;inset:0;z-index:95;background:rgba(10,8,18,.55);display:grid;place-items:center;padding:20px}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;width:100%;max-width:380px}
.dlg h3{font-size:1.25rem;margin-bottom:8px}
.dlg p{margin:0 0 6px;word-break:break-word}
.dlg .row{justify-content:flex-end;margin-top:16px}
.mhead{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:14px 0 4px;font-size:.75rem;color:var(--muted);text-align:center;text-transform:capitalize}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:10px}
.mday{min-height:84px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px;display:flex;flex-direction:column;gap:3px;text-align:left;overflow:hidden;min-width:0}
.mday b{font-size:.9rem}.mday.out{opacity:.4}.mday.today b{color:var(--rec)}.mday.sel{border-color:var(--rec);box-shadow:0 0 0 1px var(--rec)}
.mev{font-size:.68rem;background:var(--surface2);border-radius:5px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mev.pub{background:color-mix(in srgb,var(--rec) 25%,var(--surface2))}
.mnt{font-size:.66rem;color:var(--muted)}
@media (max-width:600px){.mday{min-height:62px;padding:3px}.mev{font-size:0;padding:0;height:6px;border-radius:3px;background:var(--cool)}.mev.pub{background:var(--rec)}.mnt{font-size:.6rem}}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 12px}.kpis div{background:var(--surface2);border-radius:12px;padding:10px;display:flex;flex-direction:column}
.kpis b{font-size:1.35rem;font-family:"Bricolage Grotesque",sans-serif}.kpis span{font-size:.75rem;color:var(--muted)}
.sbars{display:grid;gap:6px}.sbar{display:grid;grid-template-columns:minmax(0,1.2fr) 2fr auto;gap:8px;align-items:center;border:0;background:none;padding:2px 0;text-align:left;font-size:.85rem;color:inherit}
.sbar .sl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sbar .st2{height:10px;background:var(--surface2);border-radius:5px;overflow:hidden}.sbar .st2 i{display:block;height:100%;background:var(--rec);border-radius:5px}.sbar .sv{font-variant-numeric:tabular-nums;font-weight:700}
.dline{display:flex;gap:6px;align-items:center}.dline .field{flex:1}
.act .when{color:var(--muted);font-size:.78rem;font-weight:400;white-space:nowrap}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="fileInput" multiple hidden>

<script src="config.js" onerror="void 0"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
/* =================================================================
   LE QG — Éditeur de montage (BÊTA) — phase 1
   Import, découpe, assemblage, vitesse, volume, texte, musique,
   voix off, formats 16:9 / 9:16 / 1:1, annuler/rétablir, export.
   Projets et rushs sauvegardés sur CE PC (IndexedDB).
   ================================================================= */
(function(){
'use strict';
const MV = '2.8-beta';
const FORMATS = {'16:9':[1920,1080],'9:16':[1080,1920],'1:1':[1080,1080]};
const FONTS = [['Bricolage Grotesque','Bricolage'],['Bangers','Bangers'],['Anton','Anton'],['DM Sans','DM Sans'],['Impact','Impact']];
const SPEEDS = [0.25,0.5,0.75,1,1.25,1.5,2,3,4];

let H = {};               // helpers fournis par le QG (toast, ask, esc, saveBlob)
let root = null;
const M = {
  proj:null, projects:[], media:new Map(), sel:null, t:0, playing:false, zoom:60,
  hist:[], fut:[], vids:new Map(), auds:new Map(), imgs:new Map(),
  actx:null, master:null, dest:null, exporting:null, rec:null, raf:0, t0:0, w0:0, pre:null,
};
const esc = s => (H.esc ? H.esc(s) : String(s ?? ''));
const toast = m => H.toast && H.toast(m);
const $ = (s, r = root) => r ? r.querySelector(s) : null;
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function fmt(t){t=Math.max(0,t||0);const m=Math.floor(t/60),s=t-m*60;return m+':'+(s<10?'0':'')+s.toFixed(1)}

/* ---------------- style ---------------- */
const CSS = `
.mt{display:flex;flex-direction:column;gap:12px}
.mt-beta{background:color-mix(in srgb,#ffb020 22%,var(--surface));border:1px solid #e09a00;border-radius:12px;padding:9px 14px;font-size:.9rem}
.mt-beta b{color:var(--rec)}
.mt-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.mt-g1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mt-brk{display:none}
.mt-fsbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.88rem}
.mt-fsbar>span{flex:1;min-width:200px}
.mt-fsi{display:flex;gap:8px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:.88rem;min-width:0}

.mt-tools{display:flex;gap:2px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  -webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 36px),transparent);padding-right:30px}

const LOWPOW=(navigator.maxTouchPoints>0&&innerWidth<1100)||/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);

const clipLen=c=>hasCurve(c)?ctab(c.curve)[ctab(c.curve).length-1]*(c.out-c.in)/(c.speed||1):(c.out-c.in)/(c.speed||1);

function mediaType(f){const t=f.type||'';if(t.startsWith('video/'))return 'video';if(t.startsWith('audio/'))return 'audio';if(t.startsWith('image/'))return 'image';

      const c=document.createElement('canvas');c.width=96;c.height=54;const x=c.getContext('2d');x.fillStyle='#000';x.fillRect(0,0,96,54);fit(x,im,im.naturalWidth,im.naturalHeight,96,54);m.thumb=c.toDataURL('image/jpeg',.7);res(m)};im.onerror=()=>res(null);im.src=m.url;return}

    el.onseeked=()=>{try{const c=document.createElement('canvas');c.width=96;c.height=54;const x=c.getContext('2d');x.fillStyle='#000';x.fillRect(0,0,96,54);fit(x,el,el.videoWidth,el.videoHeight,96,54);m.thumb=c.toDataURL('image/jpeg',.7)}catch(e){}fin(m)};

async function importFiles(files,mode,paths){

    const type=mediaType(f);if(!type){toast(`« ${f.name} » : format non reconnu`);continue}
    const m={id:uid('m'),name:f.name,type,blob:f,url:URL.createObjectURL(f),size:f.size};
    toast('Import de '+f.name+'…');
    const ok=await probe(m);
    if(!ok){toast(`« ${f.name} » illisible par le navigateur (essaie MP4/H.264)`);URL.revokeObjectURL(m.url);continue}
    M.media.set(m.id,m);
    if(fpath){m.path=fpath;delete m.blob}
    try{await dbPut('media',{id:m.id,name:m.name,type:m.type,blob:fpath?undefined:m.blob,path:fpath||undefined,duration:m.duration,w:m.w,h:m.h,thumb:m.thumb,size:m.size})}

/* ---------------- audio / éléments ---------------- */

  const cids=new Set(M.proj?[...M.proj.clips,...(M.proj.overlays||[])].map(c=>c.id):[]),aids=new Set(M.proj?M.proj.audios.map(a=>a.id):[]);

/* ---------------- lecture ---------------- */
function syncMedia(t,playing){
  const act=activeAt(t),ids=new Set(act.map(a=>a.clip.id));
  const oids=new Set(M.proj.overlays.filter(o=>overlayAt(o,t)).map(o=>o.id));
  for(const [id,el] of M.vids){if(!ids.has(id)&&!oids.has(id)&&!el.paused)el.pause()}
  const td=act.length>1?trDur(act[0].idx):0,pr=td?clamp((t-act[1].start)/td,0,1):0;
  act.forEach((cur,k)=>{
    const c=cur.clip,el=vidEl(c);if(!el)return;
    const tau=clamp(t-cur.start,0,cur.len),exp=srcAt(c,tau);
    try{const r=speedAt(c,tau);if(Math.abs(el.playbackRate-r)>.02)el.playbackRate=r}catch(e){}
    const w=act.length>1?(k===0?1-pr:pr):1;
    setVol(el,c.muted?0:c.volume*w*(M.proj.vidVol??1));setFx(el,c.vfx);
    if(playing){if(el.paused){el.currentTime=exp;el.play().catch(()=>{})}else if(!el.seeking&&Math.abs(el.currentTime-exp)>(act.length>1?0.35:0.6))el.currentTime=exp}
    else{if(!el.paused)el.pause();if(Math.abs(el.currentTime-exp)>0.03)el.currentTime=exp}
  });
  if(act.length){const last=act[act.length-1],P=positions(),nx=P[last.idx+1];
    if(nx&&nx.start-t<2&&nx.start>t){const ne=vidEl(nx.clip);if(ne&&ne.paused&&Math.abs(ne.currentTime-nx.clip.in)>0.05)ne.currentTime=nx.clip.in}}
  for(const o of M.proj.overlays){
    const m=M.media.get(o.mediaId);if(!m||m.type!=='video')continue;const el=vidEl(o);if(!el)continue;
    if(overlayAt(o,t)){const exp=o.in+(t-o.start);try{el.playbackRate=1}catch(e){}setVol(el,o.muted?0:o.volume*(M.proj.vidVol??1));setFx(el,o.vfx);
      if(playing){if(el.paused){el.currentTime=exp;el.play().catch(()=>{})}else if(Math.abs(el.currentTime-exp)>0.3)el.currentTime=exp}
      else{if(!el.paused)el.pause();if(Math.abs(el.currentTime-exp)>0.03)el.currentTime=exp}}
    else{if(!el.paused)el.pause();if(o.start>t&&o.start-t<1.2&&Math.abs(el.currentTime-o.in)>0.05)el.currentTime=o.in}
  }
  for(const a of M.proj.audios){
    const el=audEl(a);if(!el)continue;const L=audLen(a);
    if(t>=a.start&&t<a.start+L){
      const loc=t-a.start,exp=a.in+loc;let f=1;
      if(a.fadeIn>0)f=Math.min(f,loc/a.fadeIn);if(a.fadeOut>0)f=Math.min(f,(L-loc)/a.fadeOut);
      setVol(el,a.volume*clamp(f,0,1));setFx(el,a.vfx);
      if(playing){if(el.paused){el.currentTime=exp;el.play().catch(()=>{})}else if(Math.abs(el.currentTime-exp)>0.3)el.currentTime=exp}
      else if(!el.paused)el.pause();
    }else if(!el.paused)el.pause();
  }
}
function play(){
  if(!M.proj||M.playing)return;
  ensureAudio();
  if(M.t>=total()-0.05)M.t=0;
  M.playing=true;M.t0=M.t;M.w0=performance.now();
  syncMedia(M.t,true);updCtrl();
  M.lastDraw=0;M.lastUi=0;
  const tick=()=>{
    if(!M.playing)return;
    const now=performance.now();let t=M.t0+(now-M.w0)/1000;const T=total();
    // horloge maître : la vidéo en cours de lecture (évite les recalages en boucle = saccades)
    const a=activeAt(M.t);
    if(a.length===1&&!hasCurve(a[0].clip)){const c=a[0].clip,el=M.vids.get(c.id);
      if(el&&!el.paused&&!el.seeking&&el.readyState>=2){const tv=a[0].start+(el.currentTime-c.in)/(c.speed||1);
        if(tv>=a[0].start-0.05&&tv<=a[0].end+0.25&&Math.abs(tv-t)<2){t=tv;M.t0=tv;M.w0=now}}}
    const scrub=!M.exporting&&now-(M.userScrollAt||0)<350;
    if(scrub){const sc=$('#mtScroll');if(sc){t=clamp(sc.scrollLeft/M.zoom,0,T);M.t0=t;M.w0=now}}
    if(t>=T){M.t=T;pause();if(M.exporting)finishExport();return}
    M.t=t;syncMedia(t,true);
    if(M.exporting||!LOWPOW||now-M.lastDraw>=31){M.lastDraw=now;draw(t)}
    const ui=M.exporting||now-M.lastUi>=(LOWPOW?120:50);if(ui)M.lastUi=now;if(!scrub)movePH(!ui);else if(ui)updTime();
    if(M.exporting)progress(t/T);
    M.raf=requestAnimationFrame(tick);
  };
  M.raf=requestAnimationFrame(tick);
}
function pause(){M.playing=false;cancelAnimationFrame(M.raf);for(const el of M.vids.values())el.pause();for(const el of M.auds.values())el.pause();updCtrl();drawNow();movePH()}
function seek(t,fromScroll){M.t=clamp(t,0,total());if(!M.playing&&M.sel&&!M._kfr){const it=findSel();if(it&&it.kf&&it.kf.length){M._kfr=1;requestAnimationFrame(()=>{M._kfr=0;renderInspector()})}}if(M.playing){M.t0=M.t;M.w0=performance.now();syncMedia(M.t,true)}else{syncMedia(M.t,false);drawNow()}if(!fromScroll)movePH();updTime()}

function fit(x,src,sw,sh,W,H){if(!sw||!sh)return;const s=Math.min(W/sw,H/sh),w=sw*s,h=sh*s;x.drawImage(src,(W-w)/2,(H-h)/2,w,h)}
function draw(t){
  const cv=$('#mtCanvas');if(!cv||!M.proj)return;
  const x=cv.getContext('2d'),W=cv.width,Hh=cv.height;
  x.fillStyle=M.proj.bg||'#000';x.fillRect(0,0,W,Hh);
  const act=activeAt(t);

}

const FILTERS={

  vif:{n:'Vif',con:1.1,sat:1.4},

  vintage:{n:'Vintage',sepia:.45,con:.95,sat:.85,bri:1.05,vig:.45},

function fxOf(c){const f=c.fx||{},P=FILTERS[f.preset||'none']||FILTERS.none;
  return {bri:(P.bri||1)*(f.bri??1),con:(P.con||1)*(f.con??1),sat:(P.sat||1)*(f.sat??1),gray:P.gray||0,sepia:P.sepia||0,hue:P.hue||0,tint:P.tint,ta:P.ta||0,vig:Math.max(P.vig||0,f.vig||0)}}
function drawClip(x,c,W,Hh,prog=0){
  const m=M.media.get(c.mediaId);if(!m)return;

/* ---------------- courbes de vitesse ---------------- */
const CURVES=[['none','Aucune',null],['montee','📈 Montée',u=>.5+1.5*u],['descente','📉 Descente',u=>2-1.5*u],['heros','🦸 Héros',u=>1-.72*Math.sin(Math.PI*u)],['bullet','🎯 Bullet',u=>1.6-1.42*Math.exp(-Math.pow((u-.5)/.12,2))],['pulse','💓 Pulsation',u=>1+.6*Math.sin(4*Math.PI*u)]];
const CURVEF=Object.fromEntries(CURVES.map(c=>[c[0],c[2]]));
const CTAB=new Map();
function ctab(curve){ // temps cumulé normalisé T(u) pour une source de durée 1 à vitesse 1
  if(CTAB.has(curve))return CTAB.get(curve);
  const f=CURVEF[curve],N=240,T=new Float64Array(N+1);for(let i=1;i<=N;i++){const u=(i-.5)/N;T[i]=T[i-1]+(1/N)/clamp(f(u),.0625,16)}
  CTAB.set(curve,T);return T;
}
function hasCurve(c){return c&&c.curve&&c.curve!=='none'&&CURVEF[c.curve]}
function srcAt(c,tau){ // temps source pour un temps local de timeline
  const sp=c.speed||1;tau=Math.max(0,tau);
  if(!hasCurve(c))return c.in+tau*sp;
  const T=ctab(c.curve),D=c.out-c.in,N=T.length-1,target=tau*sp/D;
  if(target>=T[N])return c.out;
  let lo=0,hi=N;while(hi-lo>1){const m=(lo+hi)>>1;if(T[m]<=target)lo=m;else hi=m}
  const f=(target-T[lo])/((T[hi]-T[lo])||1);return c.in+D*(lo+f)/N;
}
function speedAt(c,tau){const sp=c.speed||1;if(!hasCurve(c))return sp;const u=clamp((srcAt(c,tau)-c.in)/((c.out-c.in)||1),0,1);return clamp(sp*CURVEF[c.curve](u),.0625,16)}

const KFK=['x','y','w','size','rot','opacity'];
function itemLen(it){return it.dur!=null?it.dur:audLen(it)}
function baseProps(it){return {x:it.x??50,y:it.y??50,w:it.w??40,size:it.size??100,rot:it.rot||0,opacity:it.opacity??1}}
function propsAt(it,lt){
  const B=baseProps(it),ks=it.kf;if(!ks||!ks.length)return B;
  if(lt<=ks[0].t)return {...B,...ks[0]};
  const L=ks[ks.length-1];if(lt>=L.t)return {...B,...L};

  KFK.forEach(k=>{const va=a[k]??B[k],vb=b[k]??B[k];o[k]=va+(vb-va)*e});return o;
}
function setProp(it,k,v){
  if(!it.kf||!it.kf.length||!KFK.includes(k)){it[k]=v;return}
  const lt=clamp(M.t-it.start,0,itemLen(it));let kk=it.kf.find(q=>Math.abs(q.t-lt)<0.06);
  if(!kk){const P=propsAt(it,lt);kk={t:lt};KFK.forEach(q=>kk[q]=P[q]);it.kf.push(kk);it.kf.sort((a,b)=>a.t-b.t)}
  kk[k]=v;
}
function kfHtml(it){

    <div class="mt-chips">${ks.map((k,i)=>`<button data-kfgo="${i}" class="${cur===k?'on':''}">◆ ${fmt(k.t)}</button>`).join('')||'<span class="muted" style="font-size:.8rem">Aucune image clé</span>'}</div>
    <div class="acts" style="margin-top:6px"><button class="mt-b" data-act="kfadd">◆ Ajouter ici</button>${ks.length?'<button class="mt-b" data-act="kfprev">◀</button><button class="mt-b" data-act="kfnext">▶</button>':''}${cur?'<button class="mt-b" data-act="kfdel">🗑 Celle-ci</button>':''}${ks.length?'<button class="mt-b" data-act="kfclear">Tout effacer</button>':''}</div>`;

/* ---------------- effets de voix ---------------- */
const VFX=[['none','Aucun'],['echo','🔁 Écho'],['cave','🕳️ Grotte'],['radio','📻 Radio'],['phone','📞 Téléphone'],['robot','🤖 Robot'],['mega','📢 Mégaphone'],['water','🌊 Sous l\'eau']];
function vfxHtml(it){return `<label>🎙️ Effet de voix</label><div class="mt-chips">${VFX.map(([k,n])=>`<button data-vfx="${k}" class="${(it.vfx||'none')===k?'on':''}">${n}</button>`).join('')}</div>`}
let IMP=null;
function impulse(A,dur,decay){if(IMP)return IMP;const len=Math.floor(A.sampleRate*dur),b=A.createBuffer(2,len,A.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay)}return IMP=b}
function distCurve(k){const n=1024,c=new Float32Array(n);for(let i=0;i<n;i++){const x=i*2/n-1;c[i]=(3+k)*x*20*Math.PI/180/(Math.PI+k*Math.abs(x))}return c}
function setFx(el,type){
  if(!M.actx||!el._s||el._fx===(type||'none'))return;
  const A=M.actx,s=el._s,g=el._g;try{s.disconnect()}catch(e){}
  (el._nodes||[]).forEach(n=>{try{n.disconnect()}catch(e){}try{n.stop&&n.stop()}catch(e){}});
  const n=[],f=(t,fr,q)=>{const b=A.createBiquadFilter();b.type=t;b.frequency.value=fr;if(q)b.Q.value=q;n.push(b);return b};
  switch(type){

    case 'robot':{const rm=A.createGain();rm.gain.value=0;const o=A.createOscillator();o.frequency.value=55;o.start();o.connect(rm.gain);s.connect(rm);rm.connect(g);n.push(rm,o);break}
    case 'mega':{const hp=f('highpass',700),ws=A.createWaveShaper(),lp=f('lowpass',3800);ws.curve=distCurve(60);n.push(ws);s.connect(hp);hp.connect(ws);ws.connect(lp);lp.connect(g);break}

const SUBSTYLES={

let ASR=null,ASRkey='';
function wrap2(t,max=38){t=t.trim().replace(/\s+/g,' ');if(t.length<=max)return t;const mid=t.length/2;let best=-1;

async function buildVoiceTrack(withAudio,onp){
  const T=total(),SR=16000,out=new Float32Array(Math.ceil(T*SR)+SR),cache=new Map();let warned=false;
  const decode=async m=>{if(cache.has(m.id))return cache.get(m.id);const ab=await (await fetch(m.url)).arrayBuffer();
    const AC=new (window.AudioContext||window.webkitAudioContext)();let buf;try{buf=await AC.decodeAudioData(ab)}finally{AC.close&&AC.close()}cache.set(m.id,buf);return buf};
  const place=async(m,inS,outS,start,rate)=>{

    const oc=new OfflineAudioContext(1,Math.max(1,Math.ceil(len*SR)),SR),src=oc.createBufferSource();src.buffer=buf;src.playbackRate.value=rate;src.connect(oc.destination);src.start(0,inS,outS-inS);
    const r=(await oc.startRendering()).getChannelData(0),o=Math.floor(start*SR);for(let i=0;i<r.length&&o+i<out.length;i++)out[o+i]+=r[i];
  };

    if(!m||m.type!=='video'||c.muted)continue;
    if(hasCurve(c)){if(!warned){toast('📈 Les clips avec courbe de vitesse sont ignorés pour les sous-titres');warned=true}continue}
    try{await place(m,c.in,c.out,p.start,c.speed||1)}catch(e){toast(`Son illisible : « ${m.name} »`)}}

  return out;
}

async function genWave(m){

/* =================================================================
   MOTEUR DE SYNCHRO (hors-ligne + file d'attente)
   ================================================================= */
function fromRow(r){return {...(r.data||{}),id:r.id,kind:r.kind,at:Date.parse(r.updated_at)||Date.now(),by:r.updated_by}}
function applyOp(map,op){
  if(op.op==='delete'){map.delete(op.id);return}
  const cur=map.get(op.id)||{id:op.id,kind:op.kind};
  map.set(op.id,{...cur,...op.patch,id:op.id,kind:op.kind,at:op.ts,by:myId});
}
let cacheT=null;
function saveCache(){clearTimeout(cacheT);cacheT=setTimeout(()=>lsSet('qg-cache-'+myId,[...S.items.values()]),400)}
function saveQueue(){lsSet('qg-queue',queue)}

function put(kind,id,patch){
  const op={op:'patch',kind,id,patch,ts:Date.now()};
  applyOp(S.items,op);
  const last=queue[queue.length-1];
  if(last&&last!==inflight&&last.op==='patch'&&last.id===id){Object.assign(last.patch,patch);last.ts=op.ts}
  else queue.push(op);
  saveQueue();saveCache();scheduleRender();flush();
}
function del(id){
  const it=get(id);if(!it)return;
  queue=queue.filter(o=>o===inflight||o.id!==id);
  const op={op:'delete',kind:it.kind,id,ts:Date.now()};
  applyOp(S.items,op);queue.push(op);
  saveQueue();saveCache();scheduleRender();flush();
}
function isNetErr(e){return !navigator.onLine||!e||e.status===0||/fetch|network|timeout|load failed|aborted/i.test((e.message||'')+(e.details||''))}

async function flush(){
  if(DEMO){queue=[];saveQueue();updateNet();return}
  if(flushing||!sb||!session)return;
  updateNet();
  if(!queue.length||!navigator.onLine)return;
  flushing=true;
  while(queue.length){
    const op=queue[0];inflight=op;let error=null;
    try{
      const patch={...op.patch};
      const r=op.op==='patch'
        ? await sb.rpc('patch_item',{p_id:op.id,p_kind:op.kind,p_patch:patch})
        : await sb.from('items').delete().eq('id',op.id);
      error=r.error;
    }catch(e){error=e}
    inflight=null;
    if(error){
      if(isNetErr(error))break;
      op.tries=(op.tries||0)+1;
      if(op.tries>=3){queue.shift();toast('Une modif a été refusée par le serveur : '+(error.message||'erreur'))}
      else break;
    }else queue.shift();
    saveQueue();
  }
  flushing=false;updateNet();
  if(queue.length){clearTimeout(retryT);retryT=setTimeout(flush,5000)}
}

async function fetchAll(){
  if(!sb||!session||!navigator.onLine)return;
  let rows=[],from=0;
  for(;;){
    const {data,error}=await sb.from('items').select('*').range(from,from+999);
    if(error){updateNet();return}
    rows=rows.concat(data);if(data.length<1000)break;from+=1000;
  }
  const m=new Map();rows.forEach(r=>m.set(r.id,fromRow(r)));
  queue.forEach(op=>applyOp(m,op));
  S.items=m;S.lastFetch=Date.now();saveCache();scheduleRender();
}
function onChange(p){
  if(p.eventType==='DELETE'){if(p.old&&p.old.id)S.items.delete(p.old.id)}
  else{
    const it=fromRow(p.new);
    if(queue.some(o=>o.id===it.id&&o.op==='delete'))return;
    let merged=it;queue.forEach(o=>{if(o.id===it.id&&o.op==='patch')merged={...merged,...o.patch}});
    S.items.set(it.id,merged);
    if(notifOn()&&it.by&&it.by!==myId&&document.hidden&&it.kind!=='profile'){const l=actLabel(it);if(l)notify(plain(l),it.id)}
  }
  saveCache();scheduleRender();
}
let wasDown=false;
function connectRealtime(){
  if(channel)sb.removeChannel(channel);
  channel=sb.channel('qg-live',{config:{presence:{key:myId}}})
    .on('postgres_changes',{event:'*',schema:'public',table:'items'},onChange)
    .on('presence',{event:'sync'},()=>{S.online=Object.keys(channel.presenceState());renderTop()})
    .subscribe(st=>{
      if(st==='SUBSCRIBED'){channel.track({at:Date.now()}).catch(()=>{});if(wasDown){wasDown=false;fetchAll();flush()}}
      else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED'){wasDown=true}
    });
}

/* ---------- état réseau : bandeaux + témoin ---------- */
function updateNet(){
  const el=$('#netBanner'),sv=$('#saveState');if(!el||!sv)return;
  const n=queue.length, oldest=n?queue[0].ts:0;
  let html='',cls='';
  if(!navigator.onLine){
    cls='red';html=`<b>📡 Pas de connexion.</b> Tes modifications risquent de ne pas être enregistrées. Elles sont gardées sur cet appareil et seront envoyées automatiquement dès le retour du réseau${n?` (${n} en attente)`:''}. Ne te déconnecte pas de l'appli d'ici là.`;
  }else if(n&&Date.now()-oldest>4000){
    cls='orange';html=`<b>🐢 Connexion faible.</b> Sauvegarde en attente (${n})… ça partira tout seul, garde l'appli ouverte.`;
  }else if(Date.now()-S.reconnectedAt<3500){
    cls='green';html='<b>✅ Reconnecté.</b> Tout est synchronisé.';
  }
  if(DEMO&&!html){cls='blue';html='<b>🧪 Mode démo.</b> Tout est gardé sur cet appareil seulement, sans synchro. « Arthur (démo) » est un faux pote pour tester.'}
  el.className=html?'bn '+cls:'hidden';el.innerHTML=html;
  sv.className='save'+(!navigator.onLine&&n?' warn':'');
  if(DEMO){sv.textContent='🧪 Démo';return}
  sv.textContent=n?(navigator.onLine?'⏳ Envoi…':`⚠️ ${n} pas enregistrée${n>1?'s':''}`):(navigator.onLine?'✓ Enregistré':'📡 Hors ligne');
}
setInterval(()=>{if(queue.length||Date.now()-S.reconnectedAt<4000)updateNet()},1000);
addEventListener('online',()=>{S.reconnectedAt=Date.now();updateNet();flush();fetchAll()});
addEventListener('offline',updateNet);
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible')return;
  checkUpdate();flush();
  if(Date.now()-S.lastFetch>20000)fetchAll();
});

  defi:['Finir {G} sans {Z} : impossible ?','1 erreur = on supprime la vidéo ({G})','{N} défis dans {G}, le perdant a un gage','On a speedrun {G} sans jamais y avoir joué','Le premier qui meurt sur {G} paie le kebab','{G} mais on a {N} minutes pour tout finir','{G} : on a laissé les abonnés choisir nos règles'],
  reaction:['On note les jumpscares de {G} sur 10','On réagit à nos premières vidéos… le malaise','Vous nous avez donné vos pires idées sur {G}','On teste {N} jeux d\'horreur gratuits (classement)','On rejoue à {G} 1 an après : qui s\'est amélioré ?'],
};
const VAR={N:['3','5','7','10','24','50','100'],X:['mort','cri','jumpscare','erreur','bug','fou rire'],Y:['on boit de la sauce piquante','on change de jeu','le volume monte','on parle avec un accent','un gage pour l\'autre','on recommence'],Z:['lumière','son','parler','HUD','sauvegarde','lampe torche','courir']};
const CONCEPT=['Format 8-12 min, montage nerveux, zooms sur vos réactions.','Ouvrir direct sur le meilleur moment, puis « 3 heures plus tôt… ».','Compteur à l\'écran pour suivre le défi tout du long.','Miniature : vos deux têtes choquées + un élément du jeu en gros.','Faire voter la commu pour le gage de fin (sondage communauté).','Découper en 2 épisodes si ça dépasse 20 min.','Short vertical de 30 s avec le meilleur jumpscare pour teaser la vidéo.','Fil rouge : un score qui monte à chaque erreur, révélé à la fin.'];
function genLocal(game){
  const out=[],used=new Set();
  for(let i=0;i<50&&out.length<5;i++){
    const g=game||pick(GAMES);
    const t=pick(TPL[S.style]).replace('{G}',g).replace('{N}',pick(VAR.N)).replace('{X}',pick(VAR.X)).replace('{Y}',pick(VAR.Y)).replace('{Z}',pick(VAR.Z));
    if(!used.has(t)){used.add(t);out.push({title:t,concept:pick(CONCEPT)})}
  }
  return out;
}

function storageGauge(){

  return `<div class="panel" style="margin-top:12px;padding:12px 14px"><div class="row" style="justify-content:space-between"><b>📦 Espace du serveur</b><span class="muted">${fmtMo(u)} / 1 Go utilisés</span></div>
    <div class="bar" style="height:10px;margin-top:8px"><i style="width:${p.toFixed(1)}%;background:${col}"></i></div>
    ${p>75?`<p class="muted" style="margin:6px 0 0;font-size:.85rem">${p>90?'⚠️ Presque plein !':'Ça commence à se remplir.'} Supprime les vidéos déjà publiées pour faire de la place.</p>`:''}</div>`;
}

function bindMain(){
  const m=$('#main');
  m.onclick=e=>{
    const t=e.target.closest('button');if(!t)return;const d=t.dataset;
    if(d.cal){S.cal=d.cal==='1';render()}
    else if(d.mday){S.day=d.mday;S.cal=false;render()}
    else if(d.mnav){S.day=addMonths(S.day,+d.mnav);render()}
    else if(d.mgoto){S.day=d.mgoto;render()}
    else if(d.day){S.day=d.day;render()}
    else if(d.week){S.day=addDays(S.day,+d.week);render()}
    else if(d.goto){S.day=d.goto;render()}
    else if(d.tdel){const t=get(d.tdel);if(t)confirmDel(t.text).then(ok=>ok&&del(t.id))}
    else if(d.tmove){const tk=get(d.tmove);if(tk)askMove(tk.text,tk.date).then(nd=>{if(nd&&get(tk.id)){put('task',tk.id,{date:nd});toast('Déplacée au '+fmtDay(nd)+' 📆')}})}
    else if('newvid' in d)createVideo({shootDate:d.newvid||''});
    else if(d.openvid)openEditor(d.openvid);
    else if(d.filter){S.filter=d.filter;render()}
    else if(d.style){S.style=d.style;render()}
    else if(d.keep){saveIdea(S.gen[+d.keep]);S.gen.splice(+d.keep,1);render()}
    else if(d.tovid){const r=S.gen[+d.tovid];createVideo({title:r.title,notes:'Concept : '+r.concept+'\n\n'})}
    else if(d.star)toggleStar(d.star);
    else if(d.ideadel){const i=get(d.ideadel);if(i)confirmDel(i.title).then(ok=>ok&&del(i.id))}
    else if(d.ideavid){const i=get(d.ideavid);if(i)createVideo({title:i.title,notes:i.concept?'Concept : '+i.concept+'\n\n':''})}
    else if('upload' in d){pickFiles(d.kind,d.upload||null)}
    else if(d.fdel)deleteFile(d.fdel);
    else if(d.clean)cleanupVideo(d.clean);
  };
  m.onchange=e=>{const c=e.target.closest('[data-tcheck]');if(c)put('task',c.dataset.tcheck,{done:c.checked})};
  const tf=$('#taskForm');if(tf)tf.onsubmit=e=>{e.preventDefault();const v=$('#taskIn').value.trim();if(!v)return;
    const id=newId('t');put('task',id,{text:v,date:S.day,done:false,assignee:$('#taskWho').value,createdAt:Date.now(),createdBy:myId});
    $('#taskIn').value='';$('#taskIn').focus()};
  const dn=$('#dayNote');if(dn)dn.oninput=()=>{const day=S.day,val=dn.value;debounce('day'+day,()=>put('day','day_'+day,{note:val}),500)};
  const si=$('#searchIn');if(si)si.oninput=()=>{S.q=si.value;debounce('search',()=>{const pos=si.selectionStart;si.blur();render();const n=$('#searchIn');if(n){n.focus();n.setSelectionRange(pos,pos)}},250)};
  const gi=$('#gameIn');if(gi)gi.oninput=()=>S.gameIn=gi.value;
  const rb=$('#rollBtn');if(rb)rb.onclick=()=>{S.gen=genLocal(S.gameIn.trim());render()};
  const iform=$('#ideaForm');if(iform)iform.onsubmit=e=>{e.preventDefault();const v=$('#ideaIn').value.trim();if(!v)return;saveIdea({title:v,concept:''});$('#ideaIn').value=''};
  const drop=$('#drop');if(drop){
    drop.ondragover=e=>{e.preventDefault();drop.style.borderColor='var(--rec)'};
    drop.ondragleave=()=>drop.style.borderColor='';
    drop.ondrop=e=>{e.preventDefault();drop.style.borderColor='';uploadFiles([...e.dataTransfer.files],null)};
  }
}

function saveIdea(r){put('idea',newId('i'),{title:r.title,concept:r.concept||'',stars:[],createdAt:Date.now(),createdBy:myId});toast('Idée gardée 💾')}
function toggleStar(id){const i=get(id);if(!i)return;const st=new Set(i.stars||[]);st.has(myId)?st.delete(myId):st.add(myId);put('idea',id,{stars:[...st]})}

function pickFiles(kind,target){
  uploadTarget=target;const fi=$('#fileInput');
  fi.accept=kind==='video'?'video/*,.mp4,.mov,.m4v,.webm':kind==='photo'?'image/*':'';
  fi.click();
}
$('#fileInput').onchange=e=>{const fs=[...e.target.files];toast(fs.length?`📥 ${fs.length} fichier${fs.length>1?'s':''} reçu${fs.length>1?'s':''}…`:'Aucun fichier reçu');if(fs.length)uploadFiles(fs,uploadTarget);e.target.value=''};
function usedBytes(){return list('file').reduce((a,f)=>a+(f.size||0),0)}
function fmtMo(b){if(b<1048576)return Math.max(b?1:0,Math.round(b/1024))+' Ko';return b>=1e9?(b/1073741824).toFixed(2).replace('.',',')+' Go':Math.round(b/1048576)+' Mo'}
async function uploadFiles(files,videoId,quiet){
  const ids=[];
  if(DEMO){for(const f of files){if(usedBytes()+f.size>QUOTA){toast('📦 Espace plein (1 Go) — fais du ménage dans Fichiers');break}
      const id=newId('f');put('file',id,{url:URL.createObjectURL(f),name:f.name,type:f.type||'',size:f.size,videoId:videoId||null,createdAt:Date.now(),createdBy:myId});ids.push(id);
      if(videoId&&(f.type||'').startsWith('image/')&&get(videoId)&&!get(videoId).coverId)put('video',videoId,{coverId:id})}
    if(!quiet)toast('Démo : les fichiers disparaissent au rechargement');return ids}
  if(!navigator.onLine){toast('📡 Il faut du réseau pour envoyer des fichiers');return ids}
  for(const f of files){
    if(f.size>MAX_FILE){toast(`« ${f.name} » dépasse 50 Mo — mets plutôt un lien`);continue}
    if(usedBytes()+f.size>QUOTA){toast(`📦 Plus assez d'espace pour « ${f.name} » (${fmtMo(QUOTA-usedBytes())} libres) — fais du ménage dans Fichiers`);continue}
    const safe=f.name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w.\-]+/g,'_').slice(-80);
    const path=`${Date.now()}-${Math.random().toString(36).slice(2,8)}-${safe}`;
    toast('Envoi de '+f.name+'…');
    const {error}=await sb.storage.from('fichiers').upload(path,f,{contentType:f.type||'application/octet-stream',upsert:false});
    if(error){toast('Envoi raté : '+(error.message||'erreur'));continue}
    const id=newId('f');
    put('file',id,{path,name:f.name,type:f.type||'',size:f.size,videoId:videoId||null,createdAt:Date.now(),createdBy:myId});ids.push(id);
    if(videoId&&(f.type||'').startsWith('image/')&&get(videoId)&&!get(videoId).coverId)put('video',videoId,{coverId:id});
    if(!quiet)toast('✅ '+f.name);
  }
  return ids;
}
function cleanupList(){
  return list('video').filter(v=>v.status==='publie').map(v=>{const fs=list('file').filter(f=>f.videoId===v.id&&(f.type||'').startsWith('video/'));return {v,fs,size:fs.reduce((a,f)=>a+(f.size||0),0)}}).filter(x=>x.fs.length);
}
async function cleanupVideo(vid){
  const c=cleanupList().find(x=>x.v.id===vid);if(!c)return;
  if(!DEMO&&!navigator.onLine)return toast('📡 Il faut du réseau pour supprimer des fichiers');
  if(!await ask(`Es-tu sûr de vouloir supprimer les vidéos de « ${c.v.title||'Sans titre'} » ?`,`${c.fs.length} fichier${c.fs.length>1?'s':''} vidéo (${fmtMo(c.size)}) supprimé${c.fs.length>1?'s':''} pour vous deux. Les photos et la miniature sont gardées.`))return;
  if(!DEMO){const {error}=await sb.storage.from('fichiers').remove(c.fs.map(f=>f.path));if(error){toast('Suppression ratée : '+error.message);return}}
  c.fs.forEach(f=>del(f.id));toast(`🧹 ${fmtMo(c.size)} libérés`);
}
async function sendToQg(blob,name,videoId){
  if(blob.size>MAX_FILE){toast('Trop lourd pour le QG (50 Mo max) — exporte en version Légère');return false}
  const ids=await uploadFiles([new File([blob],name,{type:blob.type||'video/mp4'})],videoId||null,true);
  if(!ids.length)return false;
  if(videoId&&get(videoId)){const v=get(videoId);const cl=(v.checklist||[]).map(c=>/montage/i.test(c.t)?{...c,done:true}:c);
    const patch={checklist:cl};if(['idee','script','tournage'].includes(v.status))patch.status='montage';put('video',videoId,patch)}
  toast(`📁 « ${name} » envoyé dans Fichiers${videoId&&get(videoId)?` (vidéo « ${get(videoId).title||'Sans titre'} »)`:''}`);
  return true;
}
async function deleteFile(id){
  const f=get(id);if(!f)return;
  if(!DEMO&&!navigator.onLine)return toast('📡 Il faut du réseau pour supprimer un fichier');
  if(!await confirmDel(f.name))return;
  if(DEMO){list('video').filter(v=>v.coverId===id).forEach(v=>put('video',v.id,{coverId:null}));del(id);return}
  const {error}=await sb.storage.from('fichiers').remove([f.path]);
  if(error){toast('Suppression ratée : '+error.message);return}
  list('video').filter(v=>v.coverId===id).forEach(v=>put('video',v.id,{coverId:null}));
  del(id);
}

    <div id="edCmts"></div>
    <form class="row" id="cmtForm" style="margin-top:8px"><input class="field" id="cmtIn" placeholder="Écrire à ton pote…" style="flex:1" autocomplete="off"><button class="btn small">Envoyer</button></form>`);
  w.querySelectorAll('[data-f]').forEach(el=>{
    const f=el.dataset.f,instant=el.tagName==='SELECT'||el.type==='date';
    el.addEventListener(instant?'change':'input',()=>{
      const val=el.value;
      if(instant){put('video',id,{[f]:val});if(f==='status'&&val==='publie'){const c=cleanupList().find(x=>x.v.id===id);if(c)toast(`🎉 Publiée ! Pense à libérer ${fmtMo(c.size)} dans 📁 Fichiers`)}}else{const v=get(id);if(v)v[f]=val;debounce(id+f,()=>put('video',id,{[f]:val}),450)}
    });
  });
  w.addEventListener('click',e=>{
    const b=e.target.closest('button,input[type=checkbox]');if(!b)return;const d=b.dataset,v=get(id);if(!v)return;
    if('close' in d)closeSheet();
    else if(b.id==='delVid'){confirmDel(v.title||'cette vidéo').then(ok=>{if(!ok)return;
      list('task').filter(t=>t.videoId===id).forEach(t=>del(t.id));list('comment').filter(c=>c.videoId===id).forEach(c=>del(c.id));
      list('file').filter(f=>f.videoId===id).forEach(f=>put('file',f.id,{videoId:null}));
      del(id);closeSheet()})}
    else if(d.vmove){const k=d.vmove,from=v[k]||iso(new Date());askMove(`${v.title||'Sans titre'} — ${k==='pubDate'?'sortie':'tournage'}`,from).then(nd=>{if(nd&&get(id)){put('video',id,{[k]:nd});toast((k==='pubDate'?'🚀 Sortie déplacée':'🎥 Tournage déplacé')+' au '+fmtDay(nd))}})}
    else if(d.cchk!=null){const cl=(v.checklist||[]).map(c=>({...c}));cl[+d.cchk].done=b.checked;put('video',id,{checklist:cl})}
    else if(d.cdel!=null){const i=+d.cdel,it=(v.checklist||[])[i];if(it)confirmDel(it.t).then(ok=>{if(!ok)return;const cl=(get(id).checklist||[]).filter(c=>c.t!==it.t||c.done!==it.done);put('video',id,{checklist:cl})})}
    else if(d.ldel!=null){const u=(v.links||[])[+d.ldel];if(u)confirmDel(u.replace(/^https?:\/\//,'')).then(ok=>{if(ok)put('video',id,{links:(get(id).links||[]).filter(x=>x!==u)})})}
    else if('upload' in d){pickFiles(d.kind,id)}
    else if(d.cover){put('video',id,{coverId:v.coverId===d.cover?null:d.cover})}
    else if(d.fdel)deleteFile(d.fdel);
    else if(d.cmdel){const c=get(d.cmdel);if(c)confirmDel(c.text).then(ok=>ok&&del(c.id))}
  });
  $('#chkForm',w).onsubmit=e=>{e.preventDefault();const t=$('#chkIn').value.trim();if(!t)return;const v=get(id);put('video',id,{checklist:[...(v.checklist||[]),{t,done:false}]});$('#chkIn').value=''};
  $('#linkForm',w).onsubmit=e=>{e.preventDefault();let u=$('#linkIn').value.trim();if(!u)return;if(!/^https?:\/\//i.test(u))u='https://'+u;const v=get(id);put('video',id,{links:[...(v.links||[]),u]});$('#linkIn').value=''};
  $('#cmtForm',w).onsubmit=e=>{e.preventDefault();const t=$('#cmtIn').value.trim();if(!t)return;put('comment',newId('c'),{videoId:id,text:t,createdAt:Date.now(),createdBy:myId});$('#cmtIn').value=''};
  syncEditor(true);
  if(!get(id).title)setTimeout(()=>{const t=$('.titlein',w);if(t)t.focus()},60);
}
function syncEditor(first){
  const w=$('#sheet');if(!w||S.sheet!=='video'||!S.open)return;
  const v=get(S.open);
  if(!v){if(!first){toast('Cette vidéo a été supprimée');closeSheet()}return}
  w.querySelectorAll('[data-f]').forEach(el=>{const val=v[el.dataset.f]??'';if(el!==document.activeElement&&el.value!==val)el.value=val});
  {const g=$('#edYtGo',w),u=(v.ytUrl||'').trim();if(g){g.classList.toggle('hidden',!/^https?:\/\//.test(u));g.href=u}}
  $('#edInfo',w).textContent=v.by?`Modifiée par ${nameOf(v.by)} — il y a ${ago(v.at).replace("à l'instant",'quelques secondes')}`:'';
  const cl=v.checklist||[];
  $('#edCheck',w).innerHTML=cl.length?cl.map((c,i)=>`<div class="task ${c.done?'done':''}"><input type="checkbox" data-cchk="${i}" ${c.done?'checked':''} aria-label="Fait"><span class="t">${esc(c.t)}</span><button class="x" data-cdel="${i}" aria-label="Retirer">×</button></div>`).join(''):'<div class="muted" style="padding:6px 0">Pas d\'étapes.</div>';
  const ls=v.links||[];
  $('#edLinks',w).innerHTML=ls.length?ls.map((u,i)=>`<div class="link">🔗 <a href="${esc(u)}" target="_blank" rel="noopener">${esc(u.replace(/^https?:\/\//,''))}</a><button class="x" data-ldel="${i}" aria-label="Retirer">×</button></div>`).join(''):'<div class="muted" style="padding:6px 0">Aucun lien.</div>';
  const cv=v.coverId&&get(v.coverId);
  $('#edCover',w).innerHTML=cv?`<label class="l">Miniature</label><button class="cover-big" data-view="${cv.id}" data-ctx="${v.id}" aria-label="Voir la miniature en grand"><img src="${esc(fileUrl(cv))}" alt=""><span>🔍 Voir en grand</span></button><div class="row" style="justify-content:flex-end;margin-top:6px"><button class="btn ghost small" data-dl="${cv.id}">⤓ Télécharger la miniature</button></div>`:'';
  const fl=list('file').filter(f=>f.videoId===v.id);
  $('#edFiles',w).innerHTML=fl.length?`<div class="files">${fl.map(f=>fileCard(f,v.id)).join('')}</div><p class="muted" style="font-size:.82rem">☆ sur une image = la choisir comme miniature de la carte.</p>`:'<div class="muted">Aucun fichier joint.</div>';
  const cm=list('comment').filter(c=>c.videoId===v.id).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  $('#edCmts',w).innerHTML=cm.length?cm.map(c=>`<div class="cmt ${c.createdBy===myId?'me':''}">${avatar(c.createdBy,'sm')}<div class="bub">${esc(c.text)}<br><small>${esc(nameOf(c.createdBy))} — ${ago(c.createdAt||c.at)}</small></div>${c.createdBy===myId?`<button class="x" data-cmdel="${c.id}" aria-label="Supprimer">×</button>`:''}</div>`).join(''):'<div class="muted">Pas encore de message.</div>';
}

/* ---------- activité ---------- */
function actLabel(i){
  const who=`<b>${esc(nameOf(i.by))}</b>`;
  switch(i.kind){
    case 'video':return `${who} a mis à jour la vidéo « ${esc(i.title||'Sans titre')} »`;
    case 'task':return `${who} a mis à jour la tâche « ${esc(i.text)} »`;
    case 'idea':return `${who} a touché à l'idée « ${esc(i.title)} »`;
    case 'file':return `${who} a ajouté le fichier « ${esc(i.name)} »`;
    case 'comment':{const v=get(i.videoId);return `${who} a écrit sur « ${esc(v&&v.title||'une vidéo')} » : ${esc((i.text||'').slice(0,60))}`}
    case 'day':return `${who} a modifié les notes du ${esc(fmtShort(i.id.slice(4)))}`;
    default:return null;
  }
}
function openActivity(){
  S.sheet='activity';S.open=null;
  const seen=lsGet('qg-seen-'+myId,0);
  const acts=[...S.items.values()].filter(i=>i.by&&i.kind!=='profile').sort((a,b)=>b.at-a.at).slice(0,40);
  const w=sheetWrap(`<div class="row" style="margin-bottom:10px"><button class="btn ghost small" data-close>← Retour</button></div>
    <h2 class="big" style="margin-bottom:10px">Quoi de neuf</h2>
    ${acts.map(i=>{const l=actLabel(i);if(!l)return'';return `<div class="act ${i.by!==myId&&i.at>seen?'new':''}" ${i.kind==='video'||i.kind==='comment'?`data-go="${i.kind==='video'?i.id:i.videoId}"`:''} style="cursor:${i.kind==='video'||i.kind==='comment'?'pointer':'default'}">${avatar(i.by,'sm')}<span style="flex:1;min-width:0">${l}</span><span class="when">${ago(i.at)}</span></div>`}).join('')||'<div class="empty">Rien pour l\'instant.</div>'}`);
  w.addEventListener('click',e=>{if(e.target.closest('[data-close]'))closeSheet();const g=e.target.closest('[data-go]');if(g&&get(g.dataset.go))openEditor(g.dataset.go)});
  lsSet('qg-seen-'+myId,Date.now());renderTop();
}

/* ---------- réglages ---------- */
function openSettings(){
  S.sheet='settings';S.open=null;
  const me=prof(myId)||{};
  const theme=lsGet('qg-theme',null)||'dark';
  const w=sheetWrap(`<div class="row" style="margin-bottom:10px"><button class="btn ghost small" data-close>← Retour</button></div>
    <h2 class="big">Réglages</h2>
    <label class="l" for="pName">Ton pseudo</label><input class="field" id="pName" value="${esc(me.name||'')}" maxlength="30">
    <label class="l">Ta couleur</label><div class="row" id="pColors">${PALETTE.map(c=>`<button class="av" data-color="${c}" style="background:${c};margin:0;width:36px;height:36px;${(me.color||colorOf(myId))===c?'outline:3px solid var(--ink);outline-offset:2px':''}" aria-label="Couleur ${c}"></button>`).join('')}</div>
    <label class="l">Thème</label><div class="chips">${[['dark','🌙 Sombre (InShot)'],['light','☀️ Clair']].map(([k,n])=>`<button class="chip" data-theme="${k}" aria-pressed="${theme===k}">${n}</button>`).join('')}</div>
    <label class="l">🔔 Notifications</label>
    <div class="row"><button class="chip" id="notifBtn" aria-pressed="${notifOn()}">${notifOn()?'✅ Activées':'Activer les notifications'}</button>${notifOn()?'<button class="chip" id="notifTest">Tester</button>':''}</div>
    <p class="muted" style="margin:6px 0 0;font-size:.85rem">Tu es prévenu quand ton pote ajoute ou modifie quelque chose pendant que l'appli est en arrière-plan. Sur iPhone : installe d'abord l'appli sur l'écran d'accueil.</p>
    <label class="l">Installer l'appli</label><p class="muted" style="margin:0;font-size:.92rem">PC (Chrome/Edge) : icône d'installation dans la barre d'adresse.<br>Android : menu ⋮ → Installer l'application.<br>iPhone (Safari) : Partager → Sur l'écran d'accueil.</p>
    <div class="row" style="margin-top:22px"><button class="btn ghost" id="logout">${DEMO?'Effacer la démo':'Se déconnecter'}</button><span class="spacer"></span><span class="muted" style="font-size:.85rem">Le QG v${APP_VERSION}</span></div>`);
  $('#pName',w).oninput=e=>debounce('pname',()=>{const n=e.target.value.trim();if(n)put('profile','p_'+myId,{uid:myId,name:n})},500);
  w.addEventListener('click',async e=>{
    const b=e.target.closest('button');if(!b)return;
    if('close' in b.dataset)closeSheet();
    else if(b.dataset.color){put('profile','p_'+myId,{uid:myId,color:b.dataset.color});openSettings()}
    else if(b.dataset.theme){setTheme(b.dataset.theme);openSettings()}
    else if(b.id==='notifBtn'){
      if(notifOn()){lsSet('qg-notif',false);toast('🔕 Notifications désactivées');return openSettings()}
      if(!('Notification' in window)){toast('Notifications non supportées ici (sur iPhone : installe l\'appli sur l\'écran d\'accueil)');return}
      const r=await Notification.requestPermission();if(r==='granted'){lsSet('qg-notif',true);toast('🔔 Notifications activées')}else toast('Notifications refusées par le navigateur');openSettings()}
    else if(b.id==='notifTest'){notify('🔔 Test : les notifications du QG marchent !','test')}
    else if(b.id==='logout'){
      if(DEMO){if(await ask('Es-tu sûr de vouloir effacer toutes les données de démo ?','Tout reviendra comme au premier lancement.','Effacer')){localStorage.removeItem('qg-cache-'+myId);location.reload()}return}
      if(queue.length&&!await ask('Se déconnecter quand même ?',`${queue.length} modif(s) ne sont pas encore envoyées et seront perdues.`,'Se déconnecter'))return;
      queue=[];saveQueue();await sb.auth.signOut();location.reload();
    }
  });
}

/* =================================================================
   CONNEXION
   ================================================================= */
function vSetup(){
  $('#app').innerHTML=`<div class="login"><div class="panel"><h1><span class="recdot"></span>Le QG</h1>
    <p>Il manque la configuration du serveur. Ouvre <b>config.js</b> sur GitHub et colle l'URL et la clé de ton projet Supabase.</p></div></div>`;
}
function vLogin(mode='login',msg=''){
  $('#app').innerHTML=`<div class="login"><form class="panel" id="lf">
    <h1><span class="recdot"></span>Le QG</h1>
    <p class="muted" style="margin:0 0 6px">${mode==='login'?'Connecte-toi pour retrouver votre planning.':'Crée ton compte (une seule fois).'}</p>
    ${mode==='signup'?`<label for="lName">Pseudo</label><input class="field" id="lName" required maxlength="30" autocomplete="nickname">`:''}
    <label for="lMail">E-mail</label><input class="field" id="lMail" type="email" required autocomplete="email">
    <label for="lPass">Mot de passe</label><input class="field" id="lPass" type="password" required minlength="6" autocomplete="${mode==='login'?'current-password':'new-password'}">
    ${msg?`<p style="color:var(--rec);font-size:.9rem;margin:10px 0 0">${esc(msg)}</p>`:''}
    <button class="btn rec" style="width:100%;margin-top:16px" id="lBtn">${mode==='login'?'Se connecter':'Créer mon compte'}</button>
    <button type="button" class="btn ghost" style="width:100%;margin-top:8px" id="lSwitch">${mode==='login'?'Première fois ? Créer un compte':'J\'ai déjà un compte'}</button>
  </form></div>`;
  $('#lSwitch').onclick=()=>vLogin(mode==='login'?'signup':'login');
  $('#lf').onsubmit=async e=>{
    e.preventDefault();
    if(!navigator.onLine)return vLogin(mode,'Il faut du réseau pour se connecter.');
    const email=$('#lMail').value.trim(),password=$('#lPass').value;$('#lBtn').disabled=true;
    if(mode==='login'){
      const {error}=await sb.auth.signInWithPassword({email,password});
      if(error)vLogin('login',/invalid/i.test(error.message)?'E-mail ou mot de passe incorrect.':error.message);
    }else{
      const name=$('#lName').value.trim();
      const {data,error}=await sb.auth.signUp({email,password,options:{data:{name}}});
      if(error)return vLogin('signup',/disabled|not allowed/i.test(error.message)?'Les inscriptions sont fermées.':error.message);
      if(!data.session)vLogin('login','Compte créé ! Confirme ton e-mail puis connecte-toi.');
    }
  };
}

async function start(s){
  session=s;myId=s.user.id;
  const cached=lsGet('qg-cache-'+myId,[]);
  S.items=new Map(cached.map(i=>[i.id,i]));
  queue.forEach(op=>applyOp(S.items,op));
  shell();render();
  await fetchAll();
  if(!prof(myId)){
    const n=(s.user.user_metadata&&s.user.user_metadata.name)||s.user.email.split('@')[0];
    put('profile','p_'+myId,{uid:myId,name:n,color:colorOf(myId)});
  }
  connectRealtime();flush();checkUpdate();
}

(async function boot(){
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  if(DEMO){
    myId='demo-moi';session={user:{id:myId}};
    S.items=new Map(lsGet('qg-cache-'+myId,[]).map(i=>[i.id,i]));
    if(!S.items.size){
      const now=Date.now(),t=iso(new Date()),A='demo-arthur';
      const seed=[
        {id:'p_'+myId,kind:'profile',uid:myId,name:'Moi',color:'#e0283f'},
        {id:'p_'+A,kind:'profile',uid:A,name:'Arthur (démo)',color:'#3b6cf6'},
        {id:'v1',kind:'video',title:'On a joué à Phasmophobia à 3h du matin',status:'script',game:'Phasmophobia',assignee:'all',shootDate:addDays(t,1),pubDate:addDays(t,4),notes:'Intro : on éteint toutes les lumières.\nIdée miniature : nos têtes + le fantôme.',links:[],checklist:[{t:'Script / plan',done:true},{t:'Tournage',done:false},{t:'Montage',done:false},{t:'Miniature',done:false}],createdAt:now,createdBy:A},
        {id:'v2',kind:'video',title:'Lethal Company mais chaque mort = un gage',status:'idee',game:'Lethal Company',assignee:A,shootDate:'',pubDate:'',notes:'',links:[],checklist:[],createdAt:now,createdBy:myId},
        {id:'t1',kind:'task',text:'Préparer la scène de tournage',date:t,done:false,assignee:'all',createdAt:now,createdBy:A},
        {id:'t2',kind:'task',text:'Faire la miniature de la vidéo Phasmo',date:t,done:false,assignee:myId,createdAt:now+1,createdBy:myId},
        {id:'c1',kind:'comment',videoId:'v1',text:'Je ramène les chips 😂',createdAt:now,createdBy:A},
        {id:'i1',kind:'idea',title:'Si on rigole, on recommence R.E.P.O. depuis le début',concept:'Compteur à l\'écran pour suivre le défi tout du long.',stars:[A],createdAt:now,createdBy:A},
      ];
      seed.forEach(x=>S.items.set(x.id,{...x,at:now,by:x.createdBy||x.uid}));saveCache();
    }
    S.online=[myId,'demo-arthur'];
    shell();render();return;
  }
  if(!window.supabase||!CFG.SUPABASE_URL||/COLLE_ICI/.test(CFG.SUPABASE_URL+CFG.SUPABASE_ANON_KEY)){
    if(!window.supabase&&!navigator.onLine){$('#app').innerHTML='<div class="login"><div class="panel"><h1><span class="recdot"></span>Le QG</h1><p>📡 Pas de connexion pour le premier lancement. Réessaie avec du réseau.</p></div></div>';return}
    return vSetup();
  }
  sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  const {data}=await sb.auth.getSession();
  sb.auth.onAuthStateChange((ev,s)=>{
    if(ev==='SIGNED_IN'&&s&&!session)start(s);
    else if(ev==='TOKEN_REFRESHED'&&s)session=s;
    else if(ev==='SIGNED_OUT'){session=null;vLogin()}
  });
  if(data.session)start(data.session);else vLogin();
})();
</script>
